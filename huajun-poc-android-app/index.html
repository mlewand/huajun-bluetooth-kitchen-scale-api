<!doctype html>
<meta charset="utf-8" />
<title>NSCALE demo</title>
<style>
  body {
    font: 16px system-ui;
    margin: 2rem;
  }
  #weight {
    font-size: 4rem;
    font-variant-numeric: tabular-nums;
  }
  #status {
    color: #666;
  }
</style>
<button id="connect">Connect to NSCALE</button>

<script type="module" src="/src/main.ts"></script>

<button id="stop">Stop</button>
<pre id="log" style="font-size: 12px; max-height: 40vh; overflow: auto"></pre>
